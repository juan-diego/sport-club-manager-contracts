name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Install package dependencies
        run: npm ci
      - name: Install pinned security scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          pipx install semgrep==1.143.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Gitleaks detection
        shell: bash
        run: |
          set -euo pipefail
          fixture_directory="$(mktemp -d)"
          trap 'rm -rf "$fixture_directory"' EXIT
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "$fixture_directory/fixture.txt"
          if gitleaks dir "$fixture_directory" --no-git --redact; then
            echo "::error::Gitleaks did not detect the temporary scanner fixture."
            exit 1
          fi
      - name: Run release gate
        run: npm run quality
